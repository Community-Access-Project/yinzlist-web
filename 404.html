<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yinzlist</title>
<meta name="description" content="Somebody sent you a link to Yinzlist — what's in Pittsburgh today.">
<meta property="og:type" content="website">
<meta property="og:title" content="Yinzlist">
<meta property="og:description" content="Today&#39;s events across Pittsburgh.">
<meta property="og:image" content="https://yinzlist.com/social.png">
<meta property="og:image:alt" content="Yinzlist — a bridge mark in gold on a dark field">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#F2F2F5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E0F12" media="(prefers-color-scheme: dark)">
<link rel="icon" href="/mark.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
:root {
  --page: #F2F2F5; --card: #FFFFFF; --ink: #111214; --ink-2: #595D64;
  --gold: #8F5C05; --rule: rgba(17,18,20,0.12);
}
@media (prefers-color-scheme: dark) {
  :root {
    --page: #0E0F12; --card: #17191D; --ink: #F2F3F5; --ink-2: #A2A8B2;
    --gold: #F0C05A; --rule: rgba(242,243,245,0.14);
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; min-height: 100vh;
  display: flex; align-items: center; justify-content: center;
  background: var(--page); color: var(--ink); padding: 28px;
  font: 400 17px/1.6 ui-serif, Georgia, 'Times New Roman', serif;
  text-align: center; -webkit-font-smoothing: antialiased;
}

.card {
  position: relative;
  width: 100%; max-width: 30rem;
  background: var(--card);
  border: 1px solid var(--rule);
  padding: 50px 34px 42px;
}
.card::before {
  content: ''; position: absolute; inset: 9px;
  border: 1px solid var(--rule); pointer-events: none;
}

.mark {
  display: block; width: 34px; height: 34px; margin: 0 auto 20px;
  background: var(--gold);
  -webkit-mask: url(/mark.svg) no-repeat center / contain;
  mask: url(/mark.svg) no-repeat center / contain;
}
.eyebrow {
  font: 500 11px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
  letter-spacing: 0.22em; text-transform: uppercase;
  color: var(--ink-2); margin: 0 0 20px;
}
h1 {
  font: 400 clamp(24px, 5.4vw, 30px)/1.32 ui-serif, Georgia, 'Times New Roman', serif;
  margin: 0 0 22px; letter-spacing: -0.01em;
}
.handle { color: var(--gold); font-weight: 600; }
.divider { width: 36px; height: 1px; margin: 0 auto 22px; border: 0; background: var(--gold); opacity: 0.55; }
.body { color: var(--ink-2); font-size: 16px; margin: 0 0 30px; }
.cta {
  display: inline-block; text-decoration: none;
  background: var(--ink); color: var(--card);
  border-radius: 999px; padding: 13px 30px;
  font: 600 15px/1 ui-sans-serif, -apple-system, 'Helvetica Neue', sans-serif;
}
.cta:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }
.cta.ghost { background: transparent; color: var(--gold); border: 1.5px solid var(--gold); margin-left: 10px; }
.actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px 0; }
.small { font-size: 14px; color: var(--ink-2); margin: 14px 0 0; }
.small a { color: var(--gold); }
</style>
</head>
<body>
<div class="card">
  <i class="mark" aria-hidden="true"></i>
  <p class="eyebrow" id="eyebrow">You're invited</p>
  <h1 id="headline">Somebody wants you to see what&rsquo;s going on.</h1>
  <hr class="divider">
  <p class="body" id="body">
    Yinzlist gathers Pittsburgh events and local resources worth knowing about.
  </p>
  <div class="actions">
    <a class="cta" id="primary" href="/">See More</a>
    <a class="cta ghost" id="open" href="#" hidden>Open in Yinzlist</a>
  </div>
  <p class="small" id="small" hidden></p>
</div>

<script>
(function () {
  var APP_STORE_URL = 'https://testflight.apple.com/join/g3GUvEbZ';
  var SCHEME = 'yinzlist://';

  var parts = window.location.pathname.split('/').filter(Boolean);
  var kind = parts[0] || '';
  var id = parts.length > 1 ? parts[parts.length - 1] : '';
  var isHandle = kind === 'u' && /^[a-z][a-z0-9_]{2,23}$/.test(id);
  var isPost = kind === 'post' && /^[0-9a-f-]{36}$/.test(id);
  if (!isHandle && !isPost) return;

  var headline = document.getElementById('headline');
  var body = document.getElementById('body');
  var open = document.getElementById('open');
  var primary = document.getElementById('primary');
  var small = document.getElementById('small');

  if (isHandle) {
    headline.innerHTML = '<span class="handle">@' + id + '</span> wants you to see what&rsquo;s going on.';
    document.title = '@' + id + ' invited you to Yinzlist';
    open.href = SCHEME + 'u/' + id;
  } else {
    document.getElementById('eyebrow').textContent = 'Come along';
    headline.textContent = 'Somebody\u2019s going to something and wants you there.';
    body.textContent = 'A happening in Pittsburgh, with a time and a place. Open it in Yinzlist to see what, and to say you\u2019re coming.';
    document.title = 'You\u2019re invited to something on Yinzlist';
    open.href = SCHEME + 'post/' + id;
  }

  // Two buttons - the app if on device, the store if not
  open.hidden = false;
  if (APP_STORE_URL) {
    primary.textContent = 'Get Yinzlist';
    primary.href = APP_STORE_URL;
  } else {
    small.hidden = false;
    small.innerHTML = 'Yinzlist is a free iPhone app for Pittsburgh, coming soon. <a href="/">What it is</a>.';
  }
})();
</script>
</body>
</html>
